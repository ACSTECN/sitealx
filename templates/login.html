<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Login Admin — ALX Entregas</title>

<link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">

<style>

/* =========================
   RESET
========================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;

    display:flex;
    align-items:center;
    justify-content:center;

    overflow:hidden;

    font-family:Arial, Helvetica, sans-serif;

    background:
    linear-gradient(
        rgba(2,6,23,.82),
        rgba(2,6,23,.92)
    ),
    url('/static/img/quem.jpg');

    background-size:cover;
    background-position:center;
}

/* =========================
   BACKGROUND EFFECT
========================= */

body::before{
    content:"";

    position:absolute;

    width:600px;
    height:600px;

    background:rgba(56,189,248,.12);

    border-radius:50%;

    filter:blur(120px);

    top:-200px;
    left:-180px;
}

body::after{
    content:"";

    position:absolute;

    width:500px;
    height:500px;

    background:rgba(37,99,235,.10);

    border-radius:50%;

    filter:blur(120px);

    bottom:-200px;
    right:-180px;
}

/* =========================
   LOGIN CARD
========================= */

.login-wrapper{
    position:relative;
    z-index:10;

    width:100%;
    max-width:460px;

    padding:20px;
}

.login-card{
    position:relative;

    overflow:hidden;

    padding:50px;

    border-radius:34px;

    background:
    linear-gradient(
        180deg,
        rgba(255,255,255,.08),
        rgba(255,255,255,.04)
    );

    backdrop-filter:blur(24px);
    -webkit-backdrop-filter:blur(24px);

    border:1px solid rgba(255,255,255,.08);

    box-shadow:
    0 25px 60px rgba(0,0,0,.45),
    0 0 0 1px rgba(255,255,255,.04);
}

/* detalhe brilho */

.login-card::before{
    content:"";

    position:absolute;

    width:220px;
    height:220px;

    background:rgba(56,189,248,.10);

    border-radius:50%;

    top:-120px;
    right:-100px;
}

/* =========================
   LOGO
========================= */

.logo-area{
    text-align:center;
    margin-bottom:35px;
}

.logo-area img{
    width:120px;
    margin-bottom:20px;
}

.logo-area h2{
    font-size:34px;
    margin-bottom:10px;

    background:linear-gradient(90deg,#fff,#93c5fd);

    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.logo-area p{
    color:#cbd5e1;
    line-height:1.7;
}

/* =========================
   ACCESS LINKS
========================= */

.access-links{
    display:flex;
    flex-direction:column;
    gap:16px;
}

/* =========================
   BUTTON
========================= */

.primary{
    margin-top:10px;

    border:none;

    padding:18px;

    border-radius:18px;

    background:
    linear-gradient(
        135deg,
        #2563eb,
        #38bdf8
    );

    color:white;

    font-size:16px;
    font-weight:700;

    cursor:pointer;

    transition:.25s;

    box-shadow:0 15px 35px rgba(37,99,235,.35);
    text-decoration:none;
    display:block;
    text-align:center;
}

.primary:hover{
    transform:translateY(-4px);

    box-shadow:0 20px 40px rgba(37,99,235,.45);
}

.secondary-link{
    border:1px solid rgba(255,255,255,.10);
    padding:18px;
    border-radius:18px;
    background:rgba(255,255,255,.05);
    color:#dbe4ef;
    font-size:16px;
    font-weight:700;
    text-decoration:none;
    text-align:center;
    transition:.25s;
}

.secondary-link:hover{
    transform:translateY(-4px);
    background:rgba(255,255,255,.10);
}

.access-note{
    margin-top:18px;
    color:#cbd5e1;
    text-align:center;
    line-height:1.7;
    font-size:14px;
}

/* =========================
   STATUS
========================= */

.status{
    margin-top:22px;

    text-align:center;

    color:#93c5fd;

    font-size:14px;
}

/* =========================
   FOOTER
========================= */

.login-footer{
    margin-top:28px;

    text-align:center;

    color:#94a3b8;

    font-size:13px;
}

.store-badges{
    display:flex;
    justify-content:center;
    gap:14px;
    flex-wrap:wrap;
    margin-bottom:16px;
}

.store-badges img{
    height:50px;
    width:auto;
    display:block;
}

/* =========================
   RESPONSIVO
========================= */

@media(max-width:600px){

    .login-card{
        padding:35px 28px;
    }

    .logo-area h2{
        font-size:28px;
    }

}

</style>

</head>

<body>

<div class="login-wrapper">

    <section class="login-card">

        <!-- LOGO -->
        <div class="logo-area">

            <img src="/static/img/logo.png"
                 alt="ALX">

            <h2>
                Painel Administrativo
            </h2>

            <p>
                Escolha abaixo a area logada
                para acessar a plataforma.
            </p>

        </div>

        <div class="access-links">

            <a class="primary"
               href="https://alunos-lovat.vercel.app/login"
               target="_blank"
               rel="noopener">
                Area Logada Aluno
            </a>

            <a class="secondary-link"
               href="https://gerenciaralunos.vercel.app/login"
               target="_blank"
               rel="noopener">
                Area Logada Personal
            </a>

        </div>

        <div class="access-note">
            Acesso direto para aluno e personal.
        </div>

        <!-- FOOTER -->
        <div class="login-footer">
            <div class="store-badges">
                <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/7/78/Google_Play_Store_badge_EN.svg/200px-Google_Play_Store_badge_EN.svg.png"
                     alt="Disponivel no Google Play">
                <a href="https://apps.apple.com/br/app/fitbody-pro/id6760191189"
                   target="_blank"
                   rel="noopener">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/3/3c/Download_on_the_App_Store_Badge.svg/200px-Download_on_the_App_Store_Badge.svg.png"
                         alt="Baixar na App Store">
                </a>
            </div>


            © ALX Entregas

        </div>

    </section>

</div>

</body>
</html>
