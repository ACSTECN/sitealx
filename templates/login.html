<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Login Admin — ALX Entregas</title>

<link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">

<style>

/* =========================
   RESET
========================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;

    display:flex;
    align-items:center;
    justify-content:center;

    overflow:hidden;

    font-family:Arial, Helvetica, sans-serif;

    background:
    linear-gradient(
        rgba(2,6,23,.82),
        rgba(2,6,23,.92)
    ),
    url('/static/img/quem.jpg');

    background-size:cover;
    background-position:center;
}

/* =========================
   BACKGROUND EFFECT
========================= */

body::before{
    content:"";

    position:absolute;

    width:600px;
    height:600px;

    background:rgba(56,189,248,.12);

    border-radius:50%;

    filter:blur(120px);

    top:-200px;
    left:-180px;
}

body::after{
    content:"";

    position:absolute;

    width:500px;
    height:500px;

    background:rgba(37,99,235,.10);

    border-radius:50%;

    filter:blur(120px);

    bottom:-200px;
    right:-180px;
}

/* =========================
   LOGIN CARD
========================= */

.login-wrapper{
    position:relative;
    z-index:10;

    width:100%;
    max-width:460px;

    padding:20px;
}

.login-card{
    position:relative;

    overflow:hidden;

    padding:50px;

    border-radius:34px;

    background:
    linear-gradient(
        180deg,
        rgba(255,255,255,.08),
        rgba(255,255,255,.04)
    );

    backdrop-filter:blur(24px);
    -webkit-backdrop-filter:blur(24px);

    border:1px solid rgba(255,255,255,.08);

    box-shadow:
    0 25px 60px rgba(0,0,0,.45),
    0 0 0 1px rgba(255,255,255,.04);
}

/* detalhe brilho */

.login-card::before{
    content:"";

    position:absolute;

    width:220px;
    height:220px;

    background:rgba(56,189,248,.10);

    border-radius:50%;

    top:-120px;
    right:-100px;
}

/* =========================
   LOGO
========================= */

.logo-area{
    text-align:center;
    margin-bottom:35px;
}

.logo-area img{
    width:120px;
    margin-bottom:20px;
}

.logo-area h2{
    font-size:34px;
    margin-bottom:10px;

    background:linear-gradient(90deg,#fff,#93c5fd);

    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.logo-area p{
    color:#cbd5e1;
    line-height:1.7;
}

/* =========================
   FORM
========================= */

form{
    display:flex;
    flex-direction:column;
    gap:22px;
}

label{
    display:flex;
    flex-direction:column;
    gap:10px;

    color:#dbe4ef;

    font-size:14px;
}

/* INPUT */

.input-group{
    position:relative;
}

.input-group input{
    width:100%;

    padding:18px 18px 18px 20px;

    border-radius:18px;

    border:1px solid rgba(255,255,255,.08);

    background:rgba(255,255,255,.05);

    color:white;

    font-size:15px;

    outline:none;

    transition:.25s;
}

.input-group input:focus{
    border-color:#38bdf8;

    box-shadow:
    0 0 0 4px rgba(56,189,248,.12);
}

/* =========================
   BUTTON
========================= */

.primary{
    margin-top:10px;

    border:none;

    padding:18px;

    border-radius:18px;

    background:
    linear-gradient(
        135deg,
        #2563eb,
        #38bdf8
    );

    color:white;

    font-size:16px;
    font-weight:700;

    cursor:pointer;

    transition:.25s;

    box-shadow:0 15px 35px rgba(37,99,235,.35);
}

.primary:hover{
    transform:translateY(-4px);

    box-shadow:0 20px 40px rgba(37,99,235,.45);
}

/* =========================
   STATUS
========================= */

.status{
    margin-top:22px;

    text-align:center;

    color:#93c5fd;

    font-size:14px;
}

/* =========================
   FOOTER
========================= */

.login-footer{
    margin-top:28px;

    text-align:center;

    color:#94a3b8;

    font-size:13px;
}

/* =========================
   RESPONSIVO
========================= */

@media(max-width:600px){

    .login-card{
        padding:35px 28px;
    }

    .logo-area h2{
        font-size:28px;
    }

}

</style>

</head>

<body>

<div class="login-wrapper">

    <section class="login-card">

        <!-- LOGO -->
        <div class="logo-area">

            <img src="/static/img/logo.png"
                 alt="ALX">

            <h2>
                Painel Administrativo
            </h2>

            <p>
                Faça login para acessar
                o gerenciamento interno da ALX.
            </p>

        </div>

        <!-- FORM -->
        <form id="login-form">

            <label>

                Email

                <div class="input-group">

                    <input id="login-email"
                           type="email"
                           placeholder="Digite seu email"
                           required>

                </div>

            </label>

            <label>

                Senha

                <div class="input-group">

                    <input id="login-senha"
                           type="password"
                           placeholder="Digite sua senha"
                           required>

                </div>

            </label>

            <button class="primary"
                    type="submit">

                Entrar no painel

            </button>

        </form>

        <!-- STATUS -->
        <div id="login-status"
             class="status"
             aria-live="polite"></div>

        <!-- FOOTER -->
        <div class="login-footer">

            © ALX Entregas

        </div>

    </section>

</div>

<script src="{{ url_for('static', filename='login.js') }}"></script>

</body>
</html>
